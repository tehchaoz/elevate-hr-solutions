<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin | Elevate HR Solutions</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F7F4EA">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/plus-jakarta-sans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

<header class="admin-top">
  <a class="nav-logo" href="index.html" aria-label="Elevate HR Solutions, back to the site"><img src="assets/logo.png" width="300" height="148" alt="Elevate HR Solutions"></a>
  <div class="admin-top-actions">
    <a class="admin-link" href="index.html" target="_blank" rel="noopener">View site</a>
    <button type="button" class="admin-link" id="logout" hidden>Log out</button>
  </div>
</header>

<main id="main" class="admin-main">

<!-- LOGIN -->
<section id="login" class="admin-card login" aria-labelledby="login-h">
  <h1 id="login-h">Admin log in</h1>
  <form id="login-form" autocomplete="on" novalidate>
    <div class="a-field"><label for="l-email">Email</label><input id="l-email" name="email" type="email" autocomplete="username" required></div>
    <div class="a-field"><label for="l-pw">Password</label><input id="l-pw" name="password" type="password" autocomplete="current-password" required></div>
    <p class="a-msg" id="login-msg" role="alert"></p>
    <button class="btn btn-primary" type="submit">Log in</button>
  </form>
  <p class="a-fine">For the site owner and the team members they add.</p>
</section>

<!-- APP -->
<div id="app" hidden>
  <div class="admin-notice" role="note"><strong>Preview mode.</strong> Edits are saved in this browser, so they show on this computer. Visitors to the site do not see them yet.</div>

  <section id="force" class="admin-card" hidden aria-labelledby="force-h">
    <h2 id="force-h">Choose a new password</h2>
    <p>Before you continue, please replace the starting password with one of your own.</p>
    <form id="force-form" novalidate></form>
  </section>

  <div id="panels">
    <nav class="admin-tabs" role="tablist" aria-label="Admin sections" id="tabs"></nav>
    <div class="admin-card" id="panel" role="tabpanel" tabindex="-1"></div>
  </div>
  <p class="a-status" id="status" role="status" aria-live="polite"></p>
</div>

</main>
<script src="js/store.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
